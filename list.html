<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 0;
            color: #333;
        }

        section {
            background-color: #fff;
            margin: 20px auto;
            padding: 20px;
            border-radius: 8px;
            max-width: 800px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            color: #2c3e50;
        }

        ol, ul {
            padding-left: 20px;
            margin-bottom: 10px;
        }

        li {
            margin-bottom: 5px;
        }

        p {
            font-size: 16px;
            margin: 5px 0;
            color: #555;
        }
        .back-button {
        text-align: center;
        padding: 20px;
        margin: 20px auto;
    }

    .back-button a {
        display: inline-block;
        background-color: #2980b9;
        color: #fff;
        padding: 10px 20px;
        border-radius: 5px;
        font-weight: bold;
        text-decoration: none;
        transition: background-color 0.3s ease;
    }

    .back-button a:hover {
        background-color: #1c5980;
    }
    </style>
</head>
<body>

<section>
    <h1>Ordered List (Numbered)</h1>
    <ol>
        <li>Item 1</li>
        <li>Item 2</li>
    </ol>
    <p>&lt;ol&gt; = Ordered list</p>
    <p>&lt;li&gt; = List item</p>
</section>

<section>
    <h2>Unordered List (Bullets)</h2>
    <ul>
        <li>Item A</li>
        <li>Item B</li>
    </ul>
    <p>&lt;ul&gt; = Unordered list</p>
    <p>&lt;li&gt; = List item</p>
</section>

<div class="back-button">
    <a href="index.html">⬅ Back to Home</a>
</div>

</body>
</html>
