<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Tags</title>
</head>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 0;
        color: #333;
    }

    section {
        background-color: #fff;
        margin: 20px auto;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        max-width: 800px;
    }

    h1, h2, h3, h4, h5, h6 {
        color: #2c3e50;
        margin-bottom: 10px;
    }

    p {
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 10px;
    }

    hr {
        border: none;
        height: 1px;
        background-color: #ccc;
        margin: 15px 0;
    }

    a {
        color: #2980b9;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    img {
        max-width: 100%;
        height: auto;
        border-radius: 4px;
        margin-top: 10px;
    }

    b, strong {
        color: #e74c3c;
        font-weight: bold;
    }

    i, em {
        color: #8e44ad;
        font-style: italic;
    }

    .back-button {
        text-align: center;
        padding: 20px;
        margin: 20px auto;
    }

    .back-button a {
        display: inline-block;
        background-color: #2980b9;
        color: #fff;
        padding: 10px 20px;
        border-radius: 5px;
        font-weight: bold;
        text-decoration: none;
        transition: background-color 0.3s ease;
    }

    .back-button a:hover {
        background-color: #1c5980;
    }
</style>


<body>

    <section>
        <h1>Headings</h1>
        <h1></h1>
        <h2></h2>
        <h3></h3>
        <h5></h5>
        <h6></h6>
        <p>Headings &lt;h1&gt; se &lt;h6&gt; tak hota hai ,&lt;h1&gt; sab se bada hota hai size me </p>

    </section>

<section>
    <h2>Paragraph</h2>
    <p></p>
    <p>&lt;p&gt;</p>
</section>

<section>
    <h3>Horizontal Rule</h3>
    <hr>
    <p>&lt;hr&gt;</p>
</section>

<section>
    <h4>Bold/Italic</h4>
    <b>Bold Text</b>
    <strong></strong>
    <i>Italic Text</i>
    <em></em>

    <p>&lt;b&gt;, &lt;strong&gt;, &lt;i&gt;, &lt;em&gt;,</p>
</section>

<section>
    <h5>Links</h5>
    <a href=""></a>
    <p>&lt;a href=""&gt;&lt;/a&gt;</p>

    </section>

    <section>

    <h6>images</h6>
    <img src="" alt="">
    <p>&lt;img src="" alt=""&gt;</p>
    </section>

    <div class="back-button">
    <a href="index.html">⬅ Back to Home</a>
</div>


</body>

</html>
