<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comments Example</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }

        section {
            max-width: 700px;
            margin: 60px auto;
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }

        pre {
            background-color: #f4f4f4;
            padding: 15px;
            border-left: 5px solid #007BFF;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: auto;
        }

        .back-button {
            display: block;
            width: fit-content;
            margin: 30px auto 0;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .back-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <section>
        <h1>HTML Comment Example</h1>

        <p>Below is how an HTML comment looks:</p>

        <pre>
&lt;!-- ye comment hai, ye page me nahi dikhega --&gt;
        </pre>

        <a href="index.html" class="back-button">Back</a>
    </section>
</body>

</html>
