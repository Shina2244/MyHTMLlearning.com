<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Elements</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 20px;
            padding: 20px;
        }

        h1, h2, h3 {
            color: #333;
        }

        section {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        p {
            font-size: 16px;
            color: #555;
        }

        img, video, audio {
            display: block;
            margin: 15px 0;
            max-width: 100%;
            border: 2px solid #ddd;
            border-radius: 4px;
        }

        video, audio {
            background-color: #000;
        }

        .back-button {
            display: inline-block;
            background-color: #007BFF;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 20px;
        }

        .back-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <section>
        <h1>Image</h1>
        <p>HTML Code: <code>&lt;img src="image.jpg" alt="description"&gt;</code></p>
        <img src="https://via.placeholder.com/400x200" alt="Sample Image">
    </section>

    <section>
        <h2>Video</h2>
        <p>HTML Code: <code>&lt;video src="video.mp4" controls&gt;&lt;/video&gt;</code></p>
        <video src="sample-video.mp4" controls width="400">
            Your browser does not support the video tag.
        </video>
    </section>

    <section>
        <h3>Audio</h3>
        <p>HTML Code: <code>&lt;audio src="audio.mp3" controls&gt;&lt;/audio&gt;</code></p>
        <audio src="sample-audio.mp3" controls>
            Your browser does not support the audio element.
        </audio>
    </section>

    <!-- 🔙 Back Button -->
    <a href="index.html" class="back-button">⬅ Back to Home</a>

</body>
</html>
